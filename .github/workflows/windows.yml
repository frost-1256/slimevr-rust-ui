name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Format, lint, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --package slimevr-native-ui -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build (for smoke test)
        run: cargo build --locked

      # The runner has no GPU: llvmpipe under Xvfb is the only way to get a
      # GL 2.0+ context, and it exercises every page via --smoke-test.
      - name: Smoke test (Xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libxkbcommon-x11-0
          xvfb-run -a -s "-screen 0 1400x950x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 RUST_LOG=info \
            ./target/debug/slimevr-native-ui --smoke-test

  windows:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      # No GUI smoke test here: the hosted runner exposes only OpenGL 1.1
      # (GDI), and egui_glow needs 2.0+. Startup is covered by the Linux
      # Xvfb job, which runs the same binary code path via llvmpipe.

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: slimevr-native-ui-win64
          path: target/release/slimevr-native-ui.exe
          if-no-files-found: error
