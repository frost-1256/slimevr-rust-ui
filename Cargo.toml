[package]
name = "slimevr-native-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui-material3 = { version = "0.0.9", features = ["svg_solar"] }
ewebsock = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
dirs = "6"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
solarxr_protocol = { path = "vendor/solarxr-protocol" }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[workspace]
members = ["."]
exclude = ["vendor/solarxr-protocol"]
